aid: packlink
name: Packlink
description: >-
  Packlink is a multi-carrier shipping comparison and management platform for
  e-commerce, founded in Spain and backed by Accel. It lets individuals and businesses
  compare courier services (UPS, DPD, DHL, Evri, Royal Mail and more) and send parcels
  nationally and internationally at negotiated rates. Its Packlink PRO product adds a
  business shipping dashboard with marketplace and e-commerce integrations (Shopify,
  WooCommerce, Magento, PrestaShop, Amazon, eBay). The Packlink PRO Shipping API
  (api.packlink.com) exposes service comparison, shipment creation, label printing,
  parcel tracking, warehouse management, customs invoicing, and integration management,
  and Packlink maintains open-source e-commerce integration modules on GitHub.
